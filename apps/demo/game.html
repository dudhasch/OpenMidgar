<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>WebMidgar — 1.0-Integration: Spielbare Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }
    body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem auto; max-width: 76rem; padding: 0 1rem; background: #16161c; color: #ddd; }
    canvas { border: 1px solid #555; image-rendering: pixelated; display: block; background: #000; }
    button, select { font: inherit; padding: .25rem .7rem; margin-right: .4rem; }
    .row { margin: .5rem 0; display: flex; align-items: center; flex-wrap: wrap; gap: .3rem; }
    .cols { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
    .stage { position: relative; width: 640px; height: 480px; }
    #readout { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre; background: #202027; border: 1px solid #444; padding: .6rem; overflow-x: auto; min-width: 24rem; max-width: 30rem; }
    #status { font-family: ui-monospace, monospace; font-size: 12px; color: #9ad; }
    #dialogOverlay { display: none; position: absolute; left: 0; right: 0; bottom: 0; justify-content: center; pointer-events: none; }
    #dialogOverlay.visible { display: flex; }
    /*
     * Fensteroptik: NICHT mehr hier. Die am Original vermessenen Werte (F40)
     * stehen als Daten in @webmidgar/ui-window und werden zur Laufzeit von
     * applyWindowSkin() gesetzt — dieselbe Schale für Dialog, Menü und
     * Kampf-HUD. Hier bleibt nur, was Layout ist.
     * Regressionsvergleich alt/neu: apps/demo/window-skin.html
     */
    #dialogOverlay .box {
      margin-bottom: 1.2rem; min-width: 50%; max-width: 92%;
      white-space: pre-wrap;
    }
    /*
     * Auswahl-Einzug in PIXELN, nicht in em: Sobald der Text aus dem Fontblatt
     * gezeichnet wird (Welle 3), steht die Schriftgröße des Kastens auf 0 —
     * jede em-Angabe wäre dann still 0. Der Zeiger ist bis heute kein
     * Blattzeichen (er sitzt im Fenstergrafik-Blatt, WINDOW.BIN Sektion 0),
     * deshalb behält er ausdrücklich seine eigene Schriftgröße.
     */
    #dialogOverlay .choice { padding-left: 26px; }
    #dialogOverlay .choice.sel { padding-left: 0; }
    #dialogOverlay .choice.sel::before {
      content: '▶ '; font-size: 21px; line-height: 32px; vertical-align: top;
    }
    /*
     * Menü: nur noch die Zeichenfläche. Fenster, Zeilen und Balken setzt der
     * gemeinsame Maler absolut in Koordinaten der 640×480-Menüfläche (F40);
     * die Optik kommt aus @webmidgar/ui-window. Die frühere Tabelle in
     * Monospace mit eigenem Rand und eigenem Blau ist ersatzlos weg.
     */
    #menuOverlay {
      display: none; position: absolute; left: 0; top: 0;
      width: 640px; height: 480px; overflow: hidden;
    }
    #menuOverlay.visible { display: block; }
    /*
     * Kampf-HUD und Ergebnisbildschirm: nur die Zeichenfläche steht hier.
     * Jeder einzelne Kasten wird von @webmidgar/ui-battle-hud absolut in
     * Koordinaten der 640×480-Renderfläche gesetzt (am Original vermessen,
     * F40 + Nachmessung) — hier steht bewusst keine Farbe und keine Kante.
     */
    #battleOverlay, #resultOverlay {
      display: none; position: absolute; left: 0; top: 0;
      width: 640px; height: 480px; overflow: hidden; pointer-events: none;
    }
    #battleOverlay.visible, #resultOverlay.visible { display: block; }
    .controls-help { font-family: ui-monospace, monospace; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <h1>WebMidgar 1.0-Integration — Field · Weltkarte · Kampf · Menü</h1>
  <div class="row">
    <span id="status">Boot …</span>
  </div>
  <div class="row">
    <label for="fieldSelect">Field:</label>
    <select id="fieldSelect" disabled></select>
    <button id="enter" disabled>Betreten</button>
    <button id="toWorld" disabled>→ Weltkarte</button>
  </div>
  <div class="cols">
    <div class="col">
      <div class="stage">
        <canvas id="view" width="640" height="480"></canvas>
        <div id="dialogOverlay"><div class="box" id="dialogBox"></div></div>
        <div id="battleOverlay"></div>
        <div id="resultOverlay"></div>
        <div id="menuOverlay"></div>
      </div>
      <p class="controls-help">
        WASD/Pfeile bewegen · Enter/Leertaste OK · Esc abbrechen · M Menü · Tab Fahrzeug (Welt) ·
        T Weltkarten-Darstellung (Textur/Terrain/Region) ·
        F9 Field↔Welt (Ersatz, solange echte Einstiegspunkte 🔴 offen sind)
      </p>
    </div>
    <div class="col">
      <div id="readout">—</div>
    </div>
  </div>
  <script type="module" src="/src/game-demo.ts"></script>
</body>
</html>
